<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · FEHB Compass</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <script>
    // GitHub Pages serves this page for any missing path. FEHB Compass is one page, so send visitors to it,
    // keeping a #hash (a shared comparison). Project sites live under /<repo>/; user sites at the root.
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var base = location.hostname.slice(-10) === 'github.io' && parts.length ? '/' + parts[0] + '/' : '/';
      if (location.pathname !== base) location.replace(base + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e9eef6; color: #0a1122; }
    @media (prefers-color-scheme: dark) { body { background: #050913; color: #e8edf7; } a { color: #9cb0ff; } }
    main { padding: 24px; text-align: center; }
    a { color: #2a50f0; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a href="./">Go to FEHB Compass</a></p>
  </main>
</body>
</html>
